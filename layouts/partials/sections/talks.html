{{ $talks := hugo.Data.site.talks }}
<section id="talks" class="home-section" style="background-color: {{ .bg }};">
  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-md-3 section-heading"><h1>Talks</h1></div>
      <div class="col-xs-12 col-md-9">
        <ul class="news-list" style="list-style:none; padding-left:0;">
          {{ range $i, $t := $talks }}
          <li style="padding: 0.7rem 0;{{ if ne $i (sub (len $talks) 1) }} border-bottom: 1px solid #e7e7e7;{{ end }}">
            <span style="display:inline-block; min-width: 3.2rem; color:#7a7a7a; font-variant-numeric: tabular-nums; vertical-align:top;">{{ $t.date }}</span>
            <span style="display:inline-block; max-width: calc(100% - 3.5rem);">
              <em>{{ $t.title }}</em><br>
              <span style="color:#7a7a7a; font-size:.9em;">{{ $t.venue }}</span>
            </span>
          </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
</section>
