about:
  biography:
    - "I am currently a Postdoctoral Fellow at The Chinese University of Hong Kong, Shenzhen, working with Prof. Shihua Gong."
    - "I also hold a joint appointment at the Shenzhen Research Institute of Big Data (SRIBD) and the Shenzhen International Center for Industrial and Applied Mathematics (SICIAM), with Prof. Chensong Zhang as a co-mentor."
    - "I received my Ph.D. in Computational Mathematics from Xiangtan University (integrated Master-Ph.D. track), advised by Prof. Huayi Wei."
  highlights:
    - "Core contributor to <a href=\"https://github.com/weihuayi/fealpy\" target=\"_blank\" rel=\"noopener\">FEALPy</a>."
    - "First author of two registered software copyrights in structural and fracture mechanics simulation."
    - "Developer of FractureX, a brittle fracture simulation package built on FEALPy."
  interests:
    - "Computational Solid Mechanics"
    - "Numerical Methods for PDEs"
    - "Finite Element Methods"
    - "Preconditioners & Domain Decomposition"
    - "Open-Source Algorithm Libraries"
  education:
