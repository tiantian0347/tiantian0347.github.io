    - { course: "B.Sc. in Statistics", institution: "North China University of Water Resources and Electric Power" }

research:
  intro: "Efficient numerical methods for solid mechanics and fracture, and the open-source software that makes them usable."
  gallery_title: "Numerical Simulation of Brittle Fracture"
  gallery:
    - { image: "files/figures/model0.gif", title: "Benchmark Model I", caption: "Phase-field brittle fracture simulation: crack evolution process." }
    - { image: "files/figures/model1.gif", title: "Benchmark Model II", caption: "Phase-field brittle fracture simulation: crack evolution process." }
    - { image: "files/figures/model2.gif", title: "Benchmark Model III", caption: "Phase-field brittle fracture simulation: crack evolution process." }
    - { image: "files/figures/model_Lshape.gif", title: "L-shaped Domain Benchmark", caption: "Phase-field brittle fracture simulation: crack evolution process." }
  topics:
    - title: "Numerical Simulation of Brittle Fracture"
      body: "Adaptive finite element methods for phase-field fracture models based on recovery error estimates, and high-order interior penalty methods for fourth-order phase-field models. This line of work is realized in the FractureX platform built on FEALPy."
      links:
        - { text: "JCAM 2026", url: "https://doi.org/10.1016/j.cam.2025.116732" }
        - { text: "ICCES2025", url: "https://doi.org/10.32604/icces.2025.011175" }
    - title: "Finite Element Methods & Open-Source Libraries"
      body: "C0 interior penalty methods for biharmonic problems, topology optimization frameworks, and cross-platform simulation engines. As a core contributor to FEALPy, I develop modules spanning linear elasticity, truss/beam/frame structures, and adaptive finite element methods."
      links:
        - { text: "FEALPy", url: "https://github.com/weihuayi/fealpy" }
        - { text: "SOPTX (CiCP 2026)", url: "https://doi.org/10.4208/cicp.OA-2025-0168" }
    - title: "Time-Harmonic Maxwell Solver: RAS-PML Domain Decomposition"
      image: "img/research-maxwell-ras-pml.png"
      caption: "RAS-PML domain decomposition for cavity scattering."
      body: "I develop robust and scalable solvers for time-harmonic Maxwell equations based on Restricted Additive Schwarz (RAS) preconditioning with perfectly matched layer (PML) transmission treatment, targeting high-frequency cavity scattering and large-scale parallel simulation."

